definitions:
  services.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  services.Resource:
    properties:
      claim_expires_at:
        description: |-
          Lease columns (migration 8). A non-null claim_expires_at in the future
          means the row is owned by the worker in claimed_by for that duration.
          Heartbeat refreshes the deadline; on crash or shutdown the lease
          naturally expires and another worker can reclaim the row. This replaces
          the old "row updated_at is stale" heuristic for cross-pod coordination.
        type: string
      claimed_by:
        type: string
      created_at:
        type: string
      error:
        type: string
      resource_id:
        type: string
      status:
        $ref: '#/definitions/services.Status'
      stored_size:
        type: integer
      total_size:
        type: integer
      uids:
        description: |-
          Pledgers' uids (migration 9) in the order the worker tries them.
          NULL: no pledgers.
        items:
          type: string
        type: array
      updated_at:
        type: string
    type: object
  services.Status:
    enum:
    - 0
    - 1
    - 2
    - 3
    - 4
    - 5
    - 6
    format: int32
    type: integer
    x-enum-varnames:
    - StatusQueuedForStoring
    - StatusStoring
    - StatusStored
    - StatusStoreError
    - StatusQueuedForDeletion
    - StatusDeleting
    - StatusDeleteError
  services.UIDsRequest:
    properties:
      uids:
        items:
          type: string
        type: array
    type: object
info:
  contact:
    email: support@webtor.io
    name: Webtor Support
    url: https://webtor.io/support
  description: API to communicate with Vault service.
  title: Vault API
  version: "0.1"
paths:
  /resource/{id}:
    delete:
      parameters:
      - description: Resource ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/services.Resource'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/services.ErrorResponse'
      summary: Queue deletion of a resource
      tags:
      - resource
    get:
      parameters:
      - description: Resource ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/services.Resource'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/services.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/services.ErrorResponse'
      summary: Get resource
      tags:
      - resource
    put:
      consumes:
      - application/json
      description: Creates the resource if missing or marks it queued for processing.
        A non-empty uids replaces the pledgers' uids; no body or an empty list leaves
        them
      parameters:
      - description: Resource ID
        in: path
        name: id
        required: true
        type: string
      - description: Pledgers' uids
        in: body
        name: body
        schema:
          $ref: '#/definitions/services.UIDsRequest'
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/services.Resource'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/services.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/services.ErrorResponse'
      summary: Queue storing of a resource
      tags:
      - resource
  /resource/{id}/uids:
    put:
      consumes:
      - application/json
      description: Replaces the uids the worker signs with, keeping their order. The
        status is not changed and a missing resource is not created. {}, null and
        [] clear the list
      parameters:
      - description: Resource ID
        in: path
        name: id
        required: true
        type: string
      - description: Pledgers' uids
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/services.UIDsRequest'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/services.Resource'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/services.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/services.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/services.ErrorResponse'
      summary: Replace the pledgers' uids of a resource
      tags:
      - resource
  /webseed/{id}/{path}:
    get:
      description: Redirects to a presigned S3 URL for the stored file. Root path
        requires the whole resource to be stored; per-file paths are served as soon
        as the individual file is stored, even if the resource as a whole is still
        uploading.
      parameters:
      - description: Resource ID
        in: path
        name: id
        required: true
        type: string
      - description: Path inside resource
        in: path
        name: path
        required: true
        type: string
      responses:
        "302":
          description: Found
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/services.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/services.ErrorResponse'
      summary: Webseed proxy
      tags:
      - webseed
    head:
      description: Redirects to a presigned S3 URL for the stored file. Root path
        requires the whole resource to be stored; per-file paths are served as soon
        as the individual file is stored, even if the resource as a whole is still
        uploading.
      parameters:
      - description: Resource ID
        in: path
        name: id
        required: true
        type: string
      - description: Path inside resource
        in: path
        name: path
        required: true
        type: string
      responses:
        "302":
          description: Found
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/services.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/services.ErrorResponse'
      summary: Webseed proxy
      tags:
      - webseed
swagger: "2.0"
